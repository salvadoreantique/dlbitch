name: ⬇️ 01- Down load URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 Links (space separated)'
        required: true
        type: string
      mode:
        description: '📦 Mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      password:
        description: '🔒 Password for ZIP (optional)'
        required: false
        default: ''
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Config for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y aria2 zip unzip curl

      - name: Download Files
        run: |
          echo "🚀 Starting Download - No Key Required"
          mkdir -p downloads tmp
          cd tmp

          for url in ${{ github.event.inputs.urls }}; do
            echo "📥 Downloading: $url"
            aria2c --max-connection-per-server=16 --split=16 --min-split-size=1M --continue=true "$url" || curl -L -O "$url"
          done

          mv * ../downloads/ 2>/dev/null || true
          cd ..

      - name: Commit & Push
        run: |
          git add downloads/ -f
          git commit -m "⬇️ New download [skip ci]" || echo "No changes"
          git push
