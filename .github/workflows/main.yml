name: ⬇️ Download URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Paste links here (one per line)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fix SSL Certificates
        run: |
          echo "🔧 Updating CA certificates..."
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl aria2
          sudo update-ca-certificates --fresh

      - name: Git Config
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Download Files
        run: |
          echo "🚀 Starting Download..."
          mkdir -p downloads
          cd downloads

          echo "${{ github.event.inputs.urls }}" | while IFS= read -r url; do
            if [ -n "$url" ]; then
              echo "📥 Downloading: $url"
              aria2c --max-connection-per-server=8 --split=8 --min-split-size=1M --continue=true --check-certificate=false "$url" || \
              curl -L -O -C - --insecure "$url" || echo "❌ Failed: $url"
            fi
          done

      - name: Commit & Push
        run: |
          git add -f downloads/
          if git diff --staged --quiet; then
            echo "No new files"
          else
            git commit -m "⬇️ Downloaded new files [skip ci]"
            git push
            echo "✅ Successfully pushed!"
          fi
