name: ⬇️ 01- Down load URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 Paste your links (one per line or space separated)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git Config
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y aria2 curl

      - name: Download Files
        run: |
          echo "🚀 Starting Download..."
          mkdir -p downloads tmp_downloads
          cd tmp_downloads

          echo "${{ github.event.inputs.urls }}" | tr ' ' '\n' | while read -r url; do
            if [ -n "$url" ]; then
              echo "📥 Downloading: $url"
              aria2c --max-connection-per-server=16 --split=16 --min-split-size=1M --continue=true "$url" || \
              curl -L -O -C - "$url" || echo "Failed: $url"
            fi
          done

          mv * ../downloads/ 2>/dev/null || true
          cd ..

      - name: Commit & Push
        run: |
          git add -f downloads/
          if git diff --staged --quiet; then
            echo "No new files downloaded"
          else
            git commit -m "⬇️ Downloaded new files [skip ci]"
            git push
            echo "✅ Successfully committed and pushed!"
          fi
