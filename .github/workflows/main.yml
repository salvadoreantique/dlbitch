name: ⬇️ 01- Down load URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 Links (one per line or space separated)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git Config
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y aria2 zip curl

      - name: Download Files
        run: |
          echo "🚀 Starting Download - No Key Required"
          mkdir -p downloads tmp_downloads
          cd tmp_downloads

          # Better handling of multiple URLs
          echo "${{ github.event.inputs.urls }}" | tr ' ' '\n' | while read -r url; do
            if [ -n "$url" ]; then
              echo "📥 Downloading: $url"
              aria2c --max-connection-per-server=16 --split=16 --min-split-size=1M --continue=true "$url" || \
              curl -L -O -C - "$url" || echo "❌ Failed: $url"
            fi
          done

          mv * ../downloads/ 2>/dev/null || true
          cd ..

      - name: Commit & Push
        run: |
          git add downloads/ -f
          if git commit -m "⬇️ New download [skip ci]"; then
            git push
            echo "✅ Successfully pushed!"
          else
            echo "No new files to commit"
          fi
