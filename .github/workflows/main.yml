name: ⬇️ Download URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Paste links here (one per line)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Tools + Force SSL Fix
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates aria2 curl
          sudo update-ca-certificates --fresh || true

      - name: Git Config
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Download (SSL Bypass)
        run: |
          echo "🚀 Starting Download..."
          mkdir -p downloads
          cd downloads

          echo "${{ github.event.inputs.urls }}" | while IFS= read -r url; do
            if [ -n "$url" ]; then
              echo "📥 Downloading: $url"
              # Force bypass SSL completely
              aria2c --max-connection-per-server=8 --split=8 --min-split-size=1M \
                     --check-certificate=false --timeout=90 "$url" || \
              curl -L --insecure -O -C - "$url" || echo "❌ Failed: $url"
            fi
          done

      - name: Commit & Push
        run: |
          git add -f downloads/
          if git diff --staged --quiet; then
            echo "⚠️ No files downloaded"
          else
            git commit -m "⬇️ Downloaded new files [skip ci]"
            git push
            echo "✅ Successfully pushed!"
          fi
